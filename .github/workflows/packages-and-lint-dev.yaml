name: Build ROS2 Packages and Lint Repo

on:
  push:
    branches: [ "main" ]
  # No branch filter: stacked pull requests target the branch below them rather
  # than main, and a filtered-out PR runs no checks at all -- which looks the
  # same in the UI as one whose checks passed.
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint-python:
    runs-on: ubuntu-22.04
    container:
      image: ualbertaformula/f1tenth
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: src

      - name: Lint Python
        run: make -C src lint-python

  build-and-lint-cpp:
    runs-on: ubuntu-22.04
    container:
      image: ualbertaformula/f1tenth
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: src

      - name: Build packages
        run: make -C src build

      - name: Lint C++
        run: make -C src lint-cpp
