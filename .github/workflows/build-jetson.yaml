name: Build and push dockerfile to Docker Hub(jetson)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jetson.yaml'
      - 'docker/Dockerfile.jetson'
      - '.dockerignore'
      - 'Makefile'
      - 'scripts/setup.sh'
      - 'docker/deps/packages.txt'
      - 'docker/deps/requirements-common.txt'
      - 'src/**/package.xml'
      - 'docker/deps/packages-jetson.txt'
      - 'docker/deps/requirements-jetson.txt'
  pull_request:
    paths:
      - '.github/workflows/build-jetson.yaml'
      - 'docker/Dockerfile.jetson'
      - '.dockerignore'
      - 'Makefile'
      - 'scripts/setup.sh'
      - 'docker/deps/packages.txt'
      - 'docker/deps/requirements-common.txt'
      - 'src/**/package.xml'
      - 'docker/deps/packages-jetson.txt'
      - 'docker/deps/requirements-jetson.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-jetson:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image and publish on main
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.jetson
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ualbertaformula/f1tenth-jetson
