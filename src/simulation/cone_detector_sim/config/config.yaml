cone_detector_sim_node:
  ros__parameters:
    csv_path: "/home/krupal/Documents/f1/f1tenth_ws/src/src/simulation/cone_detector_sim/data/track-1.csv" # ground-truth cone CSV (id,x,y,color) -- set by scripts/set_track.py
    cone_topic: /cone_positions
    odom_topic: /ego_racecar/odom # gym_bridge's ego odom topic (cone_detector_sim is sim-only)
    loop_track: true # whether the track is a closed loop (wraps station lookup around)
    qos_depth: 10
    min_visible_dist: 0.3 # m, nothing closer than this to the car is "seen"
    max_visible_dist: 10.0 # m, forward visibility depth
    fov_half_deg: 55.0 # deg, forward visibility half-angle
    arc_window_behind_m: 1.0 # m of track already passed still eligible to show
    arc_window_ahead_m: 12.0 # m of track ahead considered for visibility
    min_publish_period_s: 0.1 # throttle: minimum seconds between published frames
    cone_marker_topic: /cone_view_markers # currently-visible cones, as MarkerArray, for RViz
    view_persist: false # false: clear previous frame's cone markers each publish. true: keep them (visual trail)
