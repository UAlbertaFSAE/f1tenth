# Package launch arguments select simulator tuning explicitly.
packages:
  - name: simulator
    package: f1tenth_gym_ros
    launch_file: gym_bridge_launch.py
    args: ["open_foxglove:=false"]
  - name: track_map
    package: map_generator
    launch_file: track_map_publisher.launch.py
  - name: cone_detector
    package: cone_detector_sim
    launch_file: cone_detector_sim.launch.py
  - name: planner
    package: path_planning
    launch_file: path_planner.launch.py
    args: ["odom_topic:=/ego_racecar/odom", "frame_id:=map"]
  - name: controller
    package: pure_pursuit
    launch_file: pure_pursuit_launch.py
    args: ["config_file:=sim_config.yaml"]
  - name: dashboard
    package: dashboard
    launch_file: dashboard.launch.py

rviz:
  enabled: true
  config_file: sim_visualizer.rviz

recording:
  save: false

rosbag:
  enabled: false

static_transforms: []
