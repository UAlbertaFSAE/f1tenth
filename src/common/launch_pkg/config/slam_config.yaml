launch:
  f1tenth_stack: true
  zed_camera: true
  lidar_driver: true
  simulator: false
  cone_detector_sim: false
  track_map_publisher: false
  camera_detection: true
  lidar_cone_filtering: true
  cone_slam: true
  path_planning: true
  safety_node: true
  pure_pursuit: true
  visualizer: true
  rosbag: true

f1tenth_stack:
  launch_file: bringup_launch.py

zed:
  camera_model: zed2i
  publish_tf: false
  publish_map_tf: false
  publish_urdf: true

lidar:
  launch_file: msg_MID360_launch.py

static_transforms:
  - parent: base_link
    child: zed_camera_link
    xyz: [-0.05, 0.0, 0.27]
    rpy: [0.0, 0.0, 0.0]
  - parent: base_link
    child: livox_frame
    xyz: [0.225, 0.0, 0.217]
    rpy: [0.0, 0.0, 0.0]
  - parent: map
    child: odom
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

# Record sensor streams and calibration alongside the existing driving topics.
rosbag:
  topics:
  - /ackermann_cmd
  - /clicked_point
  - /commands/motor/speed
  - /commands/servo/position
  - /perception/camera/observations
  - /perception/lidar/observations
  - /slam/map
  - /slam/pose
  - /slam/status
  - /slam/planner_landmarks
  - /planning/corridors
  - /slam/planner_cones
  - /cone_positions
  - /current_waypoint
  - /diagnostics
  - /drive
  - /lookahead_waypoint
  - /odom
  - /parameter_events
  - /planned_path
  - /rosout
  - /sensors/core
  - /teleop
  - /tf
  - /tf_static
  - /waypoints
  - /joy
  - /livox/lidar
  - /livox/imu
  - /zed/zed_node/rgb/color/rect/image/compressed
  - /zed/zed_node/rgb/color/rect/camera_info
  - /zed/zed_node/depth/depth_registered
  - /zed/zed_node/depth/depth_registered/camera_info
  - /zed/zed_node/imu/data

# SLAM hardware profile selected by make run_auto.
cone_slam:
  mode: mapping
  output_map_path: ""
