triangulator_node:
  ros__parameters:
    cones_topic: /cone_positions
    waypoint_topic: /waypoints
    marker_topic: /triangulation_markers
    frame_id: map

    left_color: blue
    right_color: yellow

    position_tolerance: 0.2
    cluster_distance: 8.0
    min_track_width: 0.4
    max_track_width: 10.0
    qos_depth: 10

    gate_enabled: false
    start_colors: [orange, small_orange]
    stop_colors: [orange, small_orange]
    gate_min_cone_count: 2
    gate_max_distance: 5.0

    stop_distance: 20.0
    extrapolation_step: 1.0
    publish_markers_when_idle: true

    # Disambiguate self-crossing tracks (e.g. figure-eight) by travel direction
    # instead of proximity alone -- see filter_frame_cones() in triangulator.cpp.
    direction_gate_behind_m: 1.0
    direction_gate_half_width_m: 4.0
    # At a fork, weight this heavily against picking a cluster that needs a
    # sharp turn, even if it is closer/bigger than the straight continuation.
    turn_penalty_weight: 5.0

    # Rolling local window: only the last N cone frames form the working set,
    # so a self-crossing track never lands both branches in one triangulation.
    window_frames: 6
    # Drop waypoints outside the cone corridor (hard boundary from the cones).
    boundary_constraint_enabled: true
