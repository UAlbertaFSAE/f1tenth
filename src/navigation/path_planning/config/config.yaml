triangulator_node:
  ros__parameters:
    cones_topic: /cone_positions
    odom_topic: /ego_racecar/odom
    waypoint_topic: /waypoints
    marker_topic: /triangulation_markers
    frame_id: map

    left_color: blue
    right_color: yellow

    position_tolerance: 0.2
    cluster_distance: 8.0
    min_track_width: 0.4
    max_track_width: 10.0
    qos_depth: 10

    gate_enabled: false
    start_colors: [orange, small_orange]
    stop_colors: [orange, small_orange]
    gate_min_cone_count: 2
    gate_max_distance: 5.0

    stop_distance: 20.0
    extrapolation_step: 1.0
    publish_markers_when_idle: true

    direction_gate_behind_m: 1.0
    direction_gate_half_width_m: 4.0
    turn_penalty_weight: 4.0

    window_frames: 6
    boundary_constraint_enabled: true

    # false: each publish overwrites the previous frame's markers (cones/
    # triangulation/waypoints). true: keep every frame's markers on screen
    # (visual trail) instead of replacing them.
    view_persist: false

    # Delaunay edge filters (applied in order, before midpoints are computed):
    # 1) color (Blue-Blue/Yellow-Yellow edges always dropped, not configurable)
    # 2) distance -- drop Blue-Yellow edges longer than this
    delaunay_max_edge_m: 5.0
    # 3) heading/FOV -- Lower alpha = smoother/slower to track a real turn, 
    # higher = noisier/faster.
    heading_smoothing_alpha: 0.05

    midpoint_connect_radius_m: 3.0
    max_turn_deg: 60.0

    # B-spline: uniform arc-length spacing of the final published waypoints.
    waypoint_spacing_m: 0.5
