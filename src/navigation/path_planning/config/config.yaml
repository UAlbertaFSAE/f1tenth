path_planner:
  ros__parameters:
    cones_topic: /cone_positions
    odom_topic: /odom
    waypoint_topic: /waypoints
    marker_topic: /triangulation_markers
    frame_id: odom

    left_color: blue
    right_color: yellow

    position_tolerance: 0.2
    cluster_distance: 8.0
    min_track_width: 0.4
    max_track_width: 10.0
    qos_depth: 1

    gate_enabled: false
    start_colors: [orange, small_orange]
    stop_colors: [orange, small_orange]
    gate_min_cone_count: 2
    gate_max_distance: 5.0

    stop_distance: 20.0
    extrapolation_step: 1.0
    heading_smoothing_alpha: 0.1

    max_odom_age_s: 0.2
    max_cone_age_s: 0.5
    delaunay_max_edge_m: 1.5
    waypoint_spacing_m: 0.1
    # The path ends this far past the last gate, so the car stops just past the final cones.
    end_margin_m: 0.15
    # Keep following the last valid path for at most this long once cones drop out of view.
    hold_timeout_s: 2.0
    # One-sided paths sit half this from the visible boundary; updated from the narrowest gate seen.
    track_width_m: 0.92

    # Provisional vehicle measurements: update before hardware testing.
    # base_link is assumed at the rear axle; measure overhangs separately.
    corridor_enabled: false
    vehicle_wheelbase_m: 0.335
    vehicle_width_m: 0.150
    vehicle_front_overhang_m: 0.0
    vehicle_rear_overhang_m: 0.0
    clearance_margin_m: 0.10
    cone_radius_m: 0.065
    steering_limit_deg: 25.0
    corridor_beam_width: 12
    corridor_max_gates: 20
    corridor_max_gap_m: 2.0
    corridor_width_tolerance: 0.30
    corridor_switch_margin: 0.25
    corridor_memory_s: 0.5
    heading_side_fallback: false
