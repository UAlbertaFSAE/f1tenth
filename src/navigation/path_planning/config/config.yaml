path_planner:
  ros__parameters:
    cones_topic: /cone_positions
    odom_topic: /odom
    waypoint_topic: /waypoints
    marker_topic: /triangulation_markers
    frame_id: odom

    left_color: blue
    right_color: yellow

    position_tolerance: 0.2
    cluster_distance: 8.0
    min_track_width: 0.4
    max_track_width: 10.0
    qos_depth: 1

    gate_enabled: false
    start_colors: [orange, small_orange]
    stop_colors: [orange, small_orange]
    gate_min_cone_count: 2
    gate_max_distance: 5.0

    stop_distance: 20.0
    extrapolation_step: 1.0
    heading_smoothing_alpha: 0.1

    max_odom_age_s: 0.2
    max_cone_age_s: 0.5
    delaunay_max_edge_m: 1.5
    waypoint_spacing_m: 0.1
    # The path ends this far past the last gate, so the car stops just past the final cones.
    end_margin_m: 0.15
    # Keep following the last valid path for at most this long once cones drop out of view.
    hold_timeout_s: 2.0
    # One-sided paths sit half this from the visible boundary; updated from the narrowest gate seen.
    track_width_m: 0.92
