particle_filter:
  ros__parameters:
    scan_topic: '/scan'
    odometry_topic: '/odom'
    angle_step: 18
    max_particles: 4000
    squash_factor: 2.2
    viz: 1
    max_viz_particles: 60
    range_method: 'rmgpu'
    theta_discretization: 112
    max_range: 10
    fine_timing: 0
    publish_odom: 1
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 8.0
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    rangelib_variant: 2

map_server:
  ros__parameters:
    map: 'levine'
