detection_camera:
  ros__parameters:
    depth_node: "/zed/zed_node" # example: zed depth node
    camera_node: "/zed/zed_node" # example: zed camera node
    publishing_topic: "/cone_positions" # example: topic to publish detections

    model_file: "models/model.pt"
    classes_file: "models/classes.txt"

    include_depth: true
    visualize: true
    detection_confidence: 0.5
    publish_rate_hz: 30
    apply_tf: false
    target_frame: odom

    # model_file should point at the .pt (yolo26) weights. When use_tensorrt
    # is true and TensorRT + CUDA are available, a .engine is exported next
    # to it (once, cached, reused after) at tensorrt_imgsz and used instead;
    # otherwise this falls back to running the .pt directly.
    use_tensorrt: true
    tensorrt_imgsz: 832
