[tool.ruff]
target-version = "py310"
# Vendored third-party trees only. Every first-party package is linted --
# pure_pursuit and particle_filter used to be excluded here and are not
# third-party, they are ours.
extend-exclude = [
  "src/hardware/f1tenth_system/**",
  "src/perception/livox_SDK2/**",
  "src/perception/livox_ros_driver2/**",
  "src/perception/zed_wrapper/**",
  "src/simulation/**",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pydocstyle
    "D",
    # pep8-naming
    "N",
]
ignore = [
  # line-too-long since built-in formatter only does best effort
  "E501",
  # indentation-with-invalid-multiple
  "E111",
  # indentation-with-invalid-multiple-comment
  "E114",
  # over-indented
  "E117",
  # indent-with-spaces
  "D206",
  # triple-single-quotes
  "D300",
  # missing docstring in public module
  "D100",
  # missing docstring in public package ('__init__' file at root of a python package)
  "D104",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"

# Build output and vendored third-party trees, matching ruff above. The one
# addition is setup.py: every ament_python package has one, they are all the
# top-level module "setup", and mypy refuses to check a tree with duplicate
# module names ("Duplicate module named 'setup'") rather than checking any of
# it. Ruff still lints these files.
exclude = [
    "^build/",
    "^install/",
    "^log/",
    ".*/setup\\.py$",
    ".*/build/",
    ".*/install/",
    ".*/log/",
    "^src/hardware/f1tenth_system/",
    "^src/perception/(livox_SDK2|livox_ros_driver2|zed_wrapper)/",
    "^src/simulation/",
]

warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

disallow_untyped_defs = true
disallow_untyped_decorators = true

strict_equality = true
strict_concatenate = true

ignore_missing_imports = true
follow_imports = "skip"
