# Analyze only our workspace source code.
FILTER_REGEX_INCLUDE: .*src/.*

# Exclude only genuinely vendored code. Every first-party package under src/ is
# linted, including pure_pursuit and particle_filter -- both are our own code
# and were excluded here for years, which is most of the reason the lint jobs
# looked greener than the tree actually was.
FILTER_REGEX_EXCLUDE: >-
  .*src/hardware/f1tenth_system(/.*)?
  |.*src/perception/(livox_SDK2|livox_ros_driver2|zed_wrapper)(/.*)?
  |.*src/simulation(/.*)?
  |.*/build/.*
  |.*/install/.*
  |.*/log/.*

# Check the whole tree, not just what a given PR touched. Scoping to changed
# files means nothing ever enforces the tree as a whole.
VALIDATE_ALL_CODEBASE: true

DEFAULT_WORKSPACE: .
LINTER_RULES_PATH: .

ENABLE_LINTERS:
  - PYTHON_MYPY
  - PYTHON_RUFF

# Use the central config file, the same one `make lint` passes to both tools.
PYTHON_MYPY_CONFIG_FILE: ./pyproject.toml
PYTHON_RUFF_CONFIG_FILE: ./pyproject.toml
