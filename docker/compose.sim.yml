services:
  sim:
    container_name: f1tenth_sim

    build:
      context: ..
      dockerfile: docker/Dockerfile.sim

    image: ualbertaformula/f1tenth-sim

    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DISPLAY=${DISPLAY}
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - QT_QPA_PLATFORM=xcb

    devices:
      - /dev/dxg:/dev/dxg

    volumes:
      - ../gazebo_sim:/sim/gazebo_sim
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /usr/lib/wsl:/usr/lib/wsl:ro

    tty: true
    stdin_open: true
